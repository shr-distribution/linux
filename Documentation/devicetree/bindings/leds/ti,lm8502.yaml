%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/ti,lm8502.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TI LM8502 LED Controller

maintainers:
  - webOS Community <webos-ports.org>

description: |
  The TI LM8502 is a multi-function LED controller featuring:
  - 10 individually controllable LED channels with current control
  - 3 hardware LED groups with group faders
  - 2 programmable engines for LED animation patterns
  - Vibrator/haptic feedback support (exposed as input force-feedback)
  - Camera flash (up to 600mA) and torch (up to 150mA) functionality
  - Interrupt output for engine synchronization

properties:
  compatible:
    const: ti,lm8502

  reg:
    maxItems: 1
    description: I2C address (typically 0x33)

  enable-gpios:
    maxItems: 1
    description: GPIO to enable/disable the chip

  interrupts:
    maxItems: 1
    description: Interrupt for engine completion notification

  ti,vibrator-invert:
    type: boolean
    description: Invert the vibrator direction output

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^led@[0-9]$":
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false

    properties:
      reg:
        minimum: 0
        maximum: 9
        description: LED channel number (0-9 for D1-D10)

      ti,hw-group:
        $ref: /schemas/types.yaml#/definitions/uint32
        minimum: 0
        maximum: 3
        default: 0
        description: |
          Hardware group assignment for synchronized brightness control.
          0 = no group (individual control)
          1-3 = hardware groups using group faders

    required:
      - reg

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/leds/common.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        led-controller@33 {
            compatible = "ti,lm8502";
            reg = <0x33>;

            enable-gpios = <&gpio 124 GPIO_ACTIVE_HIGH>;
            interrupt-parent = <&gpio>;
            interrupts = <42 IRQ_TYPE_EDGE_FALLING>;

            #address-cells = <1>;
            #size-cells = <0>;

            /* Keyboard backlight - all keys in hw-group 1 */
            led@0 {
                reg = <0>;
                function = LED_FUNCTION_KBD_BACKLIGHT;
                color = <LED_COLOR_ID_WHITE>;
                ti,hw-group = <1>;
            };

            /* Navigation gesture area LEDs */
            led@1 {
                reg = <1>;
                function = "navi-left";
                color = <LED_COLOR_ID_WHITE>;
            };

            led@2 {
                reg = <2>;
                function = "navi-center";
                color = <LED_COLOR_ID_WHITE>;
            };

            led@3 {
                reg = <3>;
                function = "navi-right";
                color = <LED_COLOR_ID_WHITE>;
            };
        };
    };
