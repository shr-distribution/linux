%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/qcom/qcom,msm8660-mpm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm MSM8660 / APQ8060 MPM wake-source controller

maintainers:
  - Herman van Hazendonk <github.com@herrie.org>

description: |
  The MSM Power Manager (MPM) on MSM8660 is an always-on hardware block
  that keeps a small set of wake sources alive while the application
  processor is powered down for cpuidle Power Collapse or
  suspend-to-RAM. On MSM8660 / APQ8060 the vMPM registers live INSIDE
  the RPM's 4 KB control block (RPM_BASE + 0x9d8 for request regs,
  RPM_BASE + 0xdf8 for status), with notification of new wake-source
  configuration delivered via a single-bit write to the GCC block.

  This binding is MSM8660-specific. Newer Qualcomm SoCs (sm6375 etc.)
  use the qcom,mpm binding (drivers/irqchip/irq-qcom-mpm.c) which
  assumes a dedicated MPM SRAM region and a mailbox controller (IPCC)
  for wake notification — neither holds on MSM8660.

properties:
  compatible:
    const: qcom,msm8660-mpm

  interrupts:
    maxItems: 1
    description:
      IPC IRQ raised by MPM to wake the application processor when one
      of the enabled wake sources fires. On MSM8660 this is the
      RPM_SCSS_CPU0_GP_MEDIUM_IRQ (GIC SPI 20).

  qcom,rpm-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the RPM control block exposed as a syscon. The vMPM
      registers are at fixed offsets within this block.

  qcom,mpm-request-offset:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Offset within the RPM syscon where the four MPM request registers
      live (ENABLE, DETECT_CTL, POLARITY, CLEAR). On MSM8660 this is
      0x9d8.

  qcom,mpm-status-offset:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Offset within the RPM syscon where the MPM status register
      (PENDING) lives. On MSM8660 this is 0xdf8.

  qcom,ipc:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - description: phandle to a syscon node
      - description: register offset within the syscon
      - description: bit position to set when triggering MPM
    description: |
      Three-cell IPC handshake: writing BIT(bit) at the given offset of
      the referenced syscon nudges MPM to re-read its request registers.
      On MSM8660 this targets the GCC block (l2cc syscon) at offset
      0x008 bit 1, matching legacy MSM_MPM_APPS_IPC =
      (MSM_GCC_BASE + 0x008), MSM_MPM_APPS_IPC_MPM = BIT(1).

required:
  - compatible
  - interrupts
  - qcom,rpm-syscon
  - qcom,mpm-request-offset
  - qcom,mpm-status-offset
  - qcom,ipc

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    soc {
        #address-cells = <1>;
        #size-cells = <1>;

        msm8660_mpm: msm8660-mpm {
            compatible = "qcom,msm8660-mpm";
            qcom,rpm-syscon = <&rpm>;
            qcom,mpm-request-offset = <0x9d8>;
            qcom,mpm-status-offset = <0xdf8>;
            qcom,ipc = <&l2cc 0x8 1>;
            interrupts = <GIC_SPI 20 IRQ_TYPE_EDGE_RISING>;
        };
    };
