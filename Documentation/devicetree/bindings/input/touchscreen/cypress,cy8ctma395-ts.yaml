%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/cypress,cy8ctma395-ts.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Cypress CY8CTMA395 Touchscreen (serdev)

maintainers:
  - Herrie <herrie@linuxhacker.ru>

description: |
  The Cypress CY8CTMA395 is a capacitive touchscreen controller used in
  the HP TouchPad tablet. It consists of a master CY8CTMA395 and five
  slave CY8CTMA375 chips providing a 30x40 capacitance matrix.

  The touchscreen sends raw capacitance data over UART at 4 Mbps.
  I2C is used for initialization and power management commands.

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: cypress,cy8ctma395-ts

  i2c-bus:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the I2C bus used for initialization commands

  reset-gpios:
    maxItems: 1
    description: GPIO connected to the XRES (reset) pin

  wake-gpios:
    maxItems: 1
    description: GPIO connected to the WAKE pin

  vdd-supply:
    description: Regulator for the touchscreen power supply

required:
  - compatible
  - i2c-bus
  - reset-gpios
  - wake-gpios
  - vdd-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    serial {
        touchscreen {
            compatible = "cypress,cy8ctma395-ts";
            i2c-bus = <&gsbi10_i2c>;
            reset-gpios = <&tlmm 70 GPIO_ACTIVE_LOW>;
            wake-gpios = <&tlmm 123 GPIO_ACTIVE_HIGH>;
            vdd-supply = <&pm8058_l19>;
        };
    };
