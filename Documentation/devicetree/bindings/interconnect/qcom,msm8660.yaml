%YAML 1.2
---
$id: http://devicetree.org/schemas/interconnect/qcom,msm8660.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm MSM8x60 family Network-On-Chip interconnect

maintainers:
  - Herman van Hazendonk <github.com@herrie.org>

description:
  The Qualcomm MSM8x60 family (MSM8260/MSM8660/APQ8060) NoC is split into
  four fabrics (APPSS, System, MMSS, Daytona), each modelled as a separate
  interconnect provider.  All four bandwidth-arbitration tables and the
  associated fabric/EBI/SMI bus-clock votes are owned by the RPM firmware
  and reached through the qcom,rpm parent's shared-memory interface, so
  every fabric is a child node of the qcom,rpm node and inherits the
  RPM IPC channel through its parent.

properties:
  compatible:
    enum:
      - qcom,msm8660-apps-fabric
      - qcom,msm8660-system-fabric
      - qcom,msm8660-mmss-fabric
      - qcom,msm8660-daytona-fabric

  '#interconnect-cells':
    const: 1

required:
  - compatible
  - '#interconnect-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    rpm@104000 {
        compatible = "qcom,rpm-msm8660";
        reg = <0x00104000 0x1000>;
        qcom,ipc = <&l2cc 0x8 2>;

        interrupts = <GIC_SPI 19 4>, <GIC_SPI 21 4>, <GIC_SPI 22 4>;
        interrupt-names = "ack", "err", "wakeup";

        interconnect-afab {
            compatible = "qcom,msm8660-apps-fabric";
            #interconnect-cells = <1>;
        };
    };
...
